# ── Colors ──────────────────────────

background #0B0B0B
foreground #F2F2F2

cursor #FFFFFF
cursor_text_color #0B0B0B

selection_background #666666
selection_foreground #FFFFFF

color0  #0B0B0B
color1  #B0B0B0
color2  #C0C0C0
color3  #D0D0D0
color4  #D8D8D8
color5  #E0E0E0
color6  #E8E8E8
color7  #F2F2F2

color8  #4A4A4A
color9  #C0C0C0
color10 #D0D0D0
color11 #D8D8D8
color12 #E0E0E0
color13 #E8E8E8
color14 #F0F0F0
color15 #FFFFFF

# ── Window ──────────────────────────

window_padding_width 12
confirm_os_window_close 0

# ── Cursor ──────────────────────────

cursor_shape block
cursor_blink_interval 0

# ── Tabs ────────────────────────────

tab_bar_edge top
tab_bar_style powerline
active_tab_foreground #0B0B0B
active_tab_background #FFFFFF
inactive_tab_foreground #D0D0D0
inactive_tab_background #1A1A1A

# ── Misc ────────────────────────────

enable_audio_bell no
hide_window_decorations yes
background_opacity 0.8
